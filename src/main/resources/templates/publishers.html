<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Update Publisher</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
<div th:insert="~{fragment/header :: header}"></div>
<div class="container my-2">
    <div class="card">
        <div class="card-body">
            <div th:switch="${publishers}" class="container my-5">
                <p class="my-5">
                    <a href="/add-publisher" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i>
                        <span class="ms-2">Add publisher</span>
                    </a>
                </p>
                <div class="col-md-12">
                    <h2 th:case="null">No record found !!</h2>
                    <div th:case="*">
                        <table class="table table-striped table-responsive-md">
                            <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Name</th>
                                <th scope="col">Edit</th>
                                <th scope="col">Delete</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="publisher : ${publishers}">
                                <td th:text="${publisher.id}"></td>
                                <td th:text="${publisher.name}"></td>
                                <td><a th:href="@{/update-publisher/{id}(id=${publisher.id})}" class="btn btn-primary">
                                    <i class="fas fa-edit ml-2"></i></a>
                                </td>
                                <td><a th:href="@{/remove-publisher/{id}(id=${publisher.id})}" class="btn btn-primary">
                                    <i class="fas fa-user-times ml-2"></i></a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
